    <style>
      /* ===== Base styles copied from demo-3 and trimmed ===== */
      :root {
        --bg: #f0f0f0;
        --fg: #333;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      /* Global Navigation Styles */
      .global-nav {
        position: fixed;
        top: 1rem;
        left: 1rem;
        z-index: 10000;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .nav-container {
        background: rgb(9 9 11 / 85%);
        backdrop-filter: blur(16px);
        border-radius: 12px;
        border: 0.5px solid #1e1e20;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 0 4px 16px rgb(0 0 0 / 20%);
      }

      .nav-toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        background: transparent;
        border: none;
        color: #fafafa;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        width: 100%;
        text-align: left;
        transition: all 0.2s ease;
      }

      .nav-toggle:hover {
        background: rgb(39 39 42 / 50%);
      }

      .nav-toggle svg {
        width: 16px;
        height: 16px;
        fill: currentColor;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-container.expanded .nav-toggle svg {
        transform: rotate(180deg);
      }

      .nav-menu {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .nav-container.expanded .nav-menu {
        max-height: 300px;
      }

      .nav-item {
        display: block;
        padding: 10px 16px;
        color: #a1a1aa;
        text-decoration: none;
        font-size: 13px;
        font-weight: 400;
        transition: all 0.2s ease;
        border-top: 0.5px solid #1e1e20;
        position: relative;
        cursor: pointer;
      }

      .nav-item:hover {
        background: rgb(39 39 42 / 50%);
        color: #fafafa;
      }

      .nav-item.active {
        color: #fafafa;
        background: rgb(39 39 42 / 30%);
      }

      .nav-item.active::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 2px;
        background: #fafafa;
      }

      @media (max-width: 768px) {
        .global-nav {
          top: 0.5rem;
          left: 0.5rem;
        }

        .nav-toggle {
          padding: 10px 14px;
          font-size: 13px;
        }

        .nav-item {
          padding: 8px 14px;
          font-size: 12px;
        }
      }
      .image-container {
        height: 100svh;
        overflow: clip;
      }
      .image-container img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        will-change: transform;
      }
      /* ===== Single full-viewport lens ===== */
      .shape {
        position: fixed;
        top: 10vw;
        left: 10vw;
        width: calc(100vw - 20vw);
        height: calc(100vh - 20vw);
        border-radius: 2vw;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(20px) saturate(180%);
        will-change: transform;
        pointer-events: auto;
        z-index: 9999;
      }

      @media screen and (max-width: 768px) {
        .shape {
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          width: calc(80vw);
          height: calc(50vh);
          border-radius: 4vw;
          background: rgba(255, 255, 255, 0.1);
          backdrop-filter: blur(20px) saturate(180%);
          will-change: transform;
          pointer-events: auto;
          z-index: 9999;
        }
      }

      .banner-text-container {
        position: absolute;
        inset: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        max-width: 60%;
        margin: 0 auto;
        height: 100%;
        padding-top: 150svh;
      }

      /* Headline text under lens */
      .banner-text {
        width: 100%;
        text-align: center;
        margin: 40vh auto; /* centre it visually in the long column */
        font-size: 7vw;
        font-weight: 800;
        text-transform: uppercase;
        color: #ffffff;
        pointer-events: none;
        line-height: 0.85;
      }

  <body>
    <!-- Global Navigation -->
    <nav class="global-nav">
      <div class="nav-container">
        <button
          class="nav-toggle"
          aria-expanded="false"
          aria-label="Toggle navigation menu"
        >
          <span>Demos</span>
          <svg viewBox="0 0 16 16">
            <path d="M8 11L3 6h10l-5 5z" />
          </svg>
        </button>
        <div class="nav-menu">
          <a href="../index.html" class="nav-item">Index</a>
          <a href="demo-1.html" class="nav-item">D1 - Nav Bar</a>
          <a href="demo-2.html" class="nav-item">D2 - Bank Card</a>
          <a href="demo-3.html" class="nav-item">D3 - Animate</a>
          <a href="demo-4.html" class="nav-item">D4 - Cards</a>
          <a href="demo-5.html" class="nav-item active">D5 - Reveal</a>
        </div>
      </div>
    </nav>
    <div class="main-content">
      <div class="banner-text-container">
        <div class="banner-text">
          LIQUIDGL IS A WEB BASED LIQUID GLASS REFRACTION UTILITY. DEVELOPED IN
          MANCHESTER, UK BY THE NAUGHTYDUK© TEAM. LET US KNOW IF YOU USE IT IN
          THE WILD, OR IF YOU HAVE ANY FEEDBACK, SHARING IS CARING, AFTERALL.
        </div>
      </div>
      <div class="image-container">
        <img src="/assets/liquid-bkg-_0000_Comp-33.webp" alt="bg" />
      </div>
      <div class="image-container">
        <img src="/assets/liquid-bkg-_0001_Comp-183.webp" alt="bg" />
      </div>
      <div class="image-container">
        <img src="/assets/liquid-bkg-_0002_Comp-163.webp" alt="bg" />
      </div>

    <!-- Single lens shape -->
    <div class="shape"></div>

    <!-- Libraries -->
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"
      integrity="sha384-HOvlOYPIs/zjoIkWUGXkVmXsjr8GuZLV+Q+rcPwmJOVZVpvTSXQChiN4t9Euv9Vc"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"
      integrity="sha384-P8VzCVnT9NBUkMrpcIZrJbA7EBjJvh/fJS6PmP+4nLIM284DtsImIv8D0fFjIkeh"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@studio-freight/lenis@1.0.42/dist/lenis.min.js"
      integrity="sha384-li4UtcFCH6QeUqR4JyV58/VgTprMuz9aauj+oWtew7V4Y7ZVjnvz5px9Y3UCG0Ea"
      crossorigin="anonymous"
    ></script>

    <!-- Scripts -->
    <script src="/scripts/liquidGL.js"></script>
    <script src="/scripts/liquidGL-helper.js"></script>
    <script>
      let glassEffect;
      document.addEventListener("DOMContentLoaded", () => {
        /* Global Navigation Setup */
        const navToggle = document.querySelector(".nav-toggle");
        const navContainer = document.querySelector(".nav-container");

        if (navToggle && navContainer) {
          navToggle.addEventListener("click", () => {
            const isExpanded = navContainer.classList.contains("expanded");
            navContainer.classList.toggle("expanded");
            navToggle.setAttribute("aria-expanded", !isExpanded);
          });

          // Close navigation when clicking outside
          document.addEventListener("click", (e) => {
            if (!navContainer.contains(e.target)) {
              navContainer.classList.remove("expanded");
              navToggle.setAttribute("aria-expanded", "false");
            }
          });

          // Close navigation when pressing Escape
          document.addEventListener("keydown", (e) => {
            if (
              e.key === "Escape" &&
              navContainer.classList.contains("expanded")
            ) {
              navContainer.classList.remove("expanded");
              navToggle.setAttribute("aria-expanded", "false");
            }
          });
        }

        /* 1. Init liquidGL on the big viewport shape */
        glassEffect = liquidGL({
          target: ".shape",
          snapshot: ".main-content",
          refraction: 0.026,
          bevelDepth: 0.119,
          bevelWidth: 0.057,
          frost: 0,
          specular: true,
          shadow: true,
          reveal: "fade",
          helper: true,
        });

        /* 3. Lenis + GSAP ticker sync */
        window.addEventListener("load", () => {
          liquidGL.syncWith();
        });

        document.addEventListener("mousemove", (e) => {
          gsap.to(cursor, {
            x: e.clientX,
            y: e.clientY,
            duration: 0.5,
            ease: "power3.out",
          });
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });

        document.addEventListener("scroll", () => {
          if (window.__liquidGLRenderer__) window.__liquidGLRenderer__.render();
        });
      });
    </script>
  </body>
</html>
